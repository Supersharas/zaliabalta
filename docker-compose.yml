services:

  flask:
    build: .
    container_name: my-flask-app
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: my-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask